services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  model-puller:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5vl:7b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app/static:/app/app/static
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # Max concurrent tesseract subprocesses. Default 2 is the safe floor;
      # raise on machines with ample RAM/cores. Lower if libleptonica segfaults
      # appear in dmesg under load.
      - OCR_PARALLELISM=6
      # Password protecting the web UI. Leave APP_PASSWORD empty to disable auth
      # (useful for local development). Set SESSION_SECRET to a long random string
      # so sessions survive container restarts — generate one with:
      #   python3 -c "import secrets; print(secrets.token_hex(32))"
      - APP_PASSWORD=
      - SESSION_SECRET=
    depends_on:
      ollama:
        condition: service_healthy
      model-puller:
        condition: service_completed_successfully

volumes:
  ollama_data:
