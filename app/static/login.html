<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTB Label Verification — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-lg shadow p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-gray-800 mb-1">TTB Label Verification</h1>
    <p class="text-sm text-gray-500 mb-6">Enter the password to continue.</p>
    <div id="error-msg" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded p-3">
      Incorrect password — please try again.
    </div>
    <div id="locked-msg" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded p-3">
      Too many failed attempts — try again in 10 minutes.
    </div>
    <form method="POST" action="/login">
      <label class="block text-xs text-gray-500 mb-1">Password</label>
      <input type="password" name="password" autofocus
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 mb-4" />
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
        Sign In
      </button>
    </form>
  </div>
  <script>
    const _err = new URLSearchParams(location.search).get('error');
    if (_err === 'locked') {
      document.getElementById('locked-msg').classList.remove('hidden');
    } else if (_err) {
      document.getElementById('error-msg').classList.remove('hidden');
    }
  </script>
</body>
</html>
