<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTB Label Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    textarea.auto-resize { overflow: hidden; resize: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Nav -->
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex gap-6">
    <a href="/" class="font-semibold text-blue-600">Verify</a>
    <a href="/batch-upload" class="text-gray-600 hover:text-blue-600">Batch</a>
    <a href="/history" class="text-gray-600 hover:text-blue-600">History</a>
  </nav>

  <main class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Label Verification</h1>

    <div class="grid grid-cols-2 gap-6">

      <!-- Left: Image Upload -->
      <div class="bg-white rounded-lg shadow p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-gray-700">Label Image(s)</h2>
          <div class="flex items-center gap-3 text-xs">
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="upload-mode" value="single" checked class="cursor-pointer" />
              <span>Single image</span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="upload-mode" value="dual" class="cursor-pointer" />
              <span>Front + Back</span>
            </label>
          </div>
        </div>

        <!-- Single image mode -->
        <div id="single-mode">
          <div id="drop-zone-single"
            class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg h-48 cursor-pointer hover:border-blue-400 transition-colors">
            <span class="text-gray-400 text-sm select-none" id="drop-label-single">Click or drag image here</span>
            <input type="file" id="image-input-single" accept="image/*" class="hidden" />
          </div>
          <img id="image-preview-single" class="mt-3 rounded hidden max-h-[32rem] w-full object-contain cursor-zoom-in"
               title="Click to enlarge" onclick="openModal(this.src)" />
        </div>

        <!-- Dual image mode -->
        <div id="dual-mode" class="hidden">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <div id="drop-zone-front"
                class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg h-48 cursor-pointer hover:border-blue-400 transition-colors text-xs">
                <span class="text-gray-400 select-none" id="drop-label-front">Front label</span>
                <input type="file" id="image-input-front" accept="image/*" class="hidden" />
              </div>
              <img id="image-preview-front" class="mt-2 rounded hidden max-h-64 w-full object-contain cursor-zoom-in"
                   title="Click to enlarge" onclick="openModal(this.src)" />
            </div>
            <div>
              <div id="drop-zone-back"
                class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg h-48 cursor-pointer hover:border-blue-400 transition-colors text-xs">
                <span class="text-gray-400 select-none" id="drop-label-back">Back label</span>
                <input type="file" id="image-input-back" accept="image/*" class="hidden" />
              </div>
              <img id="image-preview-back" class="mt-2 rounded hidden max-h-64 w-full object-contain cursor-zoom-in"
                   title="Click to enlarge" onclick="openModal(this.src)" />
            </div>
          </div>
        </div>

        <button id="extract-btn"
          class="mt-3 w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded disabled:opacity-50"
          disabled>
          Extract from Image
        </button>
      </div>

      <!-- Right: Form Fields -->
      <div class="bg-white rounded-lg shadow p-5">
        <h2 class="font-semibold text-gray-700 mb-3">Application Data</h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-gray-500 mb-1">Brand Name</label>
            <input id="brand_name" type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Class / Type</label>
            <input id="class_type" type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Alcohol Content</label>
            <input id="alcohol_content" type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Net Contents</label>
            <input id="net_contents" type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Producer Name &amp; Address</label>
            <textarea id="producer_name_address"
              class="auto-resize w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Country of Origin <span class="text-gray-400">(imported only)</span></label>
            <input id="country_of_origin" type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Government Warning</label>
            <textarea id="government_warning"
              class="auto-resize w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Sulfite Declaration <span class="text-gray-400">(wine only)</span></label>
            <input id="contains_sulfites" type="text" placeholder="e.g. CONTAINS SULFITES" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
        </div>
        <button id="verify-btn"
          class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded disabled:opacity-50"
          disabled>
          Verify Label
        </button>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="mt-6 hidden bg-white rounded-lg shadow p-5">
      <div id="overall-banner" class="text-lg font-bold mb-4 p-3 rounded"></div>

      <!-- Compliance section -->
      <div id="compliance-section" class="mb-5">
        <h3 class="font-semibold text-gray-700 mb-2 flex items-center gap-2">
          <span>TTB Compliance</span>
          <span id="compliance-badge" class="text-xs px-2 py-0.5 rounded font-normal"></span>
        </h3>
        <ul id="compliance-violations" class="list-disc list-inside text-sm text-red-700 space-y-1"></ul>
        <p id="compliance-ok" class="text-sm text-green-700 hidden">All TTB-required fields present and well-formed.</p>
      </div>

      <!-- Form-match table -->
      <div>
        <h3 class="font-semibold text-gray-700 mb-2">Application vs. Label</h3>
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-gray-500 border-b">
              <th class="pb-2">Field</th>
              <th class="pb-2">Status</th>
              <th class="pb-2">Extracted from Label</th>
              <th class="pb-2">Submitted Value</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </div>

    <div id="error-msg" class="mt-4 hidden text-red-600 bg-red-50 border border-red-200 rounded p-3 text-sm"></div>
  </main>

  <!-- Image zoom modal -->
  <div id="img-modal" class="hidden fixed inset-0 bg-black/75 z-50 flex items-center justify-center cursor-zoom-out"
       onclick="closeModal()">
    <img id="modal-img" class="max-w-[90vw] max-h-[90vh] object-contain rounded shadow-2xl"
         onclick="event.stopPropagation()" />
  </div>

  <script>
    const FIELDS = ['brand_name','class_type','alcohol_content','net_contents','producer_name_address','country_of_origin','government_warning','contains_sulfites'];
    const FIELD_LABELS = {
      brand_name: 'Brand Name', class_type: 'Class / Type', alcohol_content: 'Alcohol Content',
      net_contents: 'Net Contents', producer_name_address: 'Producer Name & Address',
      country_of_origin: 'Country of Origin', government_warning: 'Government Warning',
      contains_sulfites: 'Sulfite Declaration'
    };
    const STATUS_STYLE = {
      pass: 'text-green-600 font-semibold', fail: 'text-red-600 font-semibold',
      warn: 'text-yellow-600 font-semibold', not_detected: 'text-gray-400'
    };
    const STATUS_ICON = { pass: '✓', fail: '✗', warn: '⚠', not_detected: '—' };

    // ---------- Auto-resize textareas ----------
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }
    document.querySelectorAll('textarea.auto-resize').forEach(el => {
      el.addEventListener('input', () => autoResize(el));
    });

    // Set a field value and auto-resize if it's a textarea
    function setFieldValue(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = value || '';
      if (el.classList.contains('auto-resize')) autoResize(el);
    }

    // ---------- Image zoom modal ----------
    function openModal(src) {
      document.getElementById('modal-img').src = src;
      document.getElementById('img-modal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('img-modal').classList.add('hidden');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ---------- Image upload state ----------
    let mode = 'single';
    let singleFile = null;
    let frontFile = null;
    let backFile = null;

    function wireDropzone(zoneId, inputId, labelId, previewId, onPick) {
      const zone  = document.getElementById(zoneId);
      const input = document.getElementById(inputId);
      const label = document.getElementById(labelId);
      const preview = document.getElementById(previewId);

      function pickFile(file) {
        label.textContent = file.name;
        preview.src = URL.createObjectURL(file);
        preview.classList.remove('hidden');
        onPick(file);
      }

      // Click to open file picker
      zone.addEventListener('click', () => input.click());
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) pickFile(file);
      });

      // Drag-and-drop
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        zone.classList.add('border-blue-400', 'bg-blue-50');
      });
      zone.addEventListener('dragleave', () => {
        zone.classList.remove('border-blue-400', 'bg-blue-50');
      });
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('border-blue-400', 'bg-blue-50');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) pickFile(file);
      });
    }

    wireDropzone('drop-zone-single', 'image-input-single', 'drop-label-single', 'image-preview-single',
      f => { singleFile = f; refreshButtons(); });
    wireDropzone('drop-zone-front', 'image-input-front', 'drop-label-front', 'image-preview-front',
      f => { frontFile = f; refreshButtons(); });
    wireDropzone('drop-zone-back', 'image-input-back', 'drop-label-back', 'image-preview-back',
      f => { backFile = f; refreshButtons(); });

    document.querySelectorAll('input[name="upload-mode"]').forEach(el => {
      el.addEventListener('change', (e) => {
        mode = e.target.value;
        document.getElementById('single-mode').classList.toggle('hidden', mode !== 'single');
        document.getElementById('dual-mode').classList.toggle('hidden', mode !== 'dual');
        refreshButtons();
      });
    });

    function hasImage() {
      return mode === 'single' ? !!singleFile : !!frontFile;
    }
    function refreshButtons() {
      const enabled = hasImage();
      document.getElementById('extract-btn').disabled = !enabled;
      document.getElementById('verify-btn').disabled = !enabled;
    }
    function buildFormData() {
      const fd = new FormData();
      if (mode === 'single') {
        fd.append('image', singleFile);
      } else {
        fd.append('image', frontFile);
        if (backFile) fd.append('back_image', backFile);
      }
      return fd;
    }

    // ---------- Field helpers ----------
    function clearFields() {
      FIELDS.forEach(f => {
        setFieldValue(f, '');
        markField(f, false);
      });
    }
    function resetHighlights() {
      FIELDS.forEach(f => markField(f, false));
    }

    // ---------- Extract ----------
    document.getElementById('extract-btn').addEventListener('click', async () => {
      if (!hasImage()) return;
      const btn = document.getElementById('extract-btn');
      btn.textContent = 'Extracting...';
      btn.disabled = true;
      clearFields();
      try {
        const res = await fetch('/extract', { method: 'POST', body: buildFormData() });
        if (!res.ok) throw new Error((await res.json()).detail);
        const data = await res.json();
        FIELDS.forEach(f => {
          if (data[f]) {
            setFieldValue(f, data[f]);
            markField(f, false);
          } else {
            // Highlight fields the model couldn't extract so the user knows to fill them
            markField(f, true);
          }
        });
      } catch (err) {
        showError(err.message);
      } finally {
        btn.textContent = 'Extract from Image';
        btn.disabled = !hasImage();
      }
    });

    // ---------- Verify ----------
    document.getElementById('verify-btn').addEventListener('click', async () => {
      if (!hasImage()) return;
      const btn = document.getElementById('verify-btn');
      btn.textContent = 'Verifying...';
      btn.disabled = true;
      document.getElementById('error-msg').classList.add('hidden');
      document.getElementById('results').classList.add('hidden');
      resetHighlights();

      // If the form is blank, auto-extract first so submitted values are populated
      const hasFormData = FIELDS.some(f => document.getElementById(f)?.value?.trim());
      if (!hasFormData) {
        try {
          const extRes = await fetch('/extract', { method: 'POST', body: buildFormData() });
          if (extRes.ok) {
            const extData = await extRes.json();
            FIELDS.forEach(f => { if (extData[f]) setFieldValue(f, extData[f]); });
          }
        } catch (_) { /* proceed with empty values if extraction fails */ }
      }

      const fd = buildFormData();
      FIELDS.forEach(f => fd.append(f, document.getElementById(f).value));

      try {
        const res = await fetch('/verify', { method: 'POST', body: fd });
        if (!res.ok) throw new Error((await res.json()).detail);
        renderResults(await res.json());
      } catch (err) {
        showError(err.message);
      } finally {
        btn.textContent = 'Verify Label';
        btn.disabled = !hasImage();
      }
    });

    // ---------- Render ----------
    function renderResults(data) {
      const banner = document.getElementById('overall-banner');
      const compliantOK = data.compliance.compliant;
      const matchOK = data.form_match.overall_pass;

      if (data.overall_pass) {
        banner.textContent = '✓ APPROVED — Application matches label and label is TTB compliant';
        banner.className = 'text-lg font-bold mb-4 p-3 rounded bg-green-50 text-green-700';
      } else {
        const reasons = [];
        if (!matchOK) reasons.push('application data does not match label');
        if (!compliantOK) reasons.push('label is not TTB compliant');
        banner.textContent = '✗ REJECTED — ' + reasons.join(', ');
        banner.className = 'text-lg font-bold mb-4 p-3 rounded bg-red-50 text-red-700';
      }

      // Compliance section
      const violations = data.compliance.violations;
      const ul   = document.getElementById('compliance-violations');
      const ok   = document.getElementById('compliance-ok');
      const badge = document.getElementById('compliance-badge');
      if (compliantOK) {
        badge.textContent = 'COMPLIANT';
        badge.className = 'text-xs px-2 py-0.5 rounded font-normal bg-green-100 text-green-700';
        ul.innerHTML = '';
        ok.classList.remove('hidden');
        resetHighlights();
      } else {
        badge.textContent = `${violations.length} VIOLATION${violations.length === 1 ? '' : 'S'}`;
        badge.className = 'text-xs px-2 py-0.5 rounded font-normal bg-red-100 text-red-700';
        ul.innerHTML = violations.map(v => `<li><strong>${v.label}:</strong> ${v.message}</li>`).join('');
        ok.classList.add('hidden');
        resetHighlights();
        violations.forEach(v => markField(v.field, true));
      }

      // Form-match table
      const tbody = document.getElementById('results-body');
      tbody.innerHTML = data.form_match.fields.map(f => `
        <tr class="border-b last:border-0">
          <td class="py-2 text-gray-700">${FIELD_LABELS[f.field] || f.field}</td>
          <td class="py-2 ${STATUS_STYLE[f.status]}">${STATUS_ICON[f.status]} ${f.status.replace('_', ' ')}</td>
          <td class="py-2 text-gray-600 text-xs max-w-xs truncate">${f.extracted_value ?? '—'}</td>
          <td class="py-2 text-gray-600 text-xs max-w-xs truncate">${f.submitted_value ?? '—'}</td>
        </tr>`).join('');
      document.getElementById('results').classList.remove('hidden');
    }

    function markField(field, isViolation) {
      const el = document.getElementById(field);
      if (!el) return;
      el.classList.toggle('border-red-400', isViolation);
      el.classList.toggle('bg-red-50', isViolation);
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
